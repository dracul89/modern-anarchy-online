# Builds the workspace and runs its tests on every push to main and on every pull request.
#
# Windows is the system the client is developed and played on: its job has to pass. Linux is built and tested too, but
# the client has not been played there, so that job may fail without failing the run. macOS is built on every run
# (a build that breaks there shows at once) and may fail the same way; its tests run only when asked for (Actions tab,
# "Run workflow", the box ticked): the Windows and Linux jobs run them, and on a private repository a macOS minute
# counts as ten.
#
# No game is installed on the build machines, so the tests that read the game's files skip themselves (MAO_GAME is not
# set), and the render tests run on the machine's software graphics device or skip when there is none.
# See docs/RELEASING.md.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'tools/**.py'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'tools/**.py'
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the tests on macOS (it is built on every run)
        type: boolean
        default: false

# A newer push to the same branch stops the run of the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# (the same shell on every system, one that stops at the first command that fails)
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTUP_MAX_RETRIES: 5
  CARGO_NET_RETRY: 5

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, required: true, tests: true }
          - { name: Linux, os: ubuntu-latest, required: false, tests: true }
          - { name: macOS, os: macos-latest, required: false, tests: false }
    steps:
      - uses: actions/checkout@v7

      - name: Linux build packages (ALSA's headers for the sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # The compiled dependencies are kept between runs; the release workflow uses the same ones.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-build

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Test
        if: matrix.tests || inputs.macos
        run: cargo test --workspace --release --locked
