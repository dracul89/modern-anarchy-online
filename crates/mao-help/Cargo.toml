[package]
name = "mao-help"
description = "The help assistant's core: a player's own index of help pages and guides (the game's help files, sites the player chooses), searched on the player's machine, with an optional answer from a language model behind an endpoint the player sets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mao-help"
path = "src/main.rs"

[dependencies]
candle-core = { version = "0.11.1", default-features = false, optional = true }
candle-transformers = { version = "0.11.1", default-features = false, optional = true }
mao-formats.workspace = true
rayon = { version = "1.12.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }

[lints]
workspace = true

[features]
# The model inside the client (`local.rs`): candle's inference and the tokenizer. On by default; a build without it
# (`--no-default-features`) still searches, and still talks to a model behind an address.
default = ["local-model"]
local-model = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "dep:sha2", "dep:rayon"]
