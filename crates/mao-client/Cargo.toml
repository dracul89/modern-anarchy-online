[package]
name = "mao-client"
description = "The client: window, input and the game loop."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `hide-console`: the Windows program without a console window (the packages are built with it: tools/package.ps1).
# Without it, as a build for working on the client is made, the program has a console and its commands print there.
[features]
hide-console = []

# The Windows executable's icon resource (build.rs; `assets/icon/mao.ico`).
[build-dependencies]
winresource = "0.1"

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
image.workspace = true
mao-formats.workspace = true
mao-help = { path = "../mao-help" }
mao-net.workspace = true
mao-render.workspace = true
pollster = "1.0.1"
# (the screenshots' local time)
time = { version = "0.3.55", default-features = false, features = ["std", "local-offset"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis", "mp3"] }
winit = "0.30.13"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
rfd = "=0.15.4"


# The in-game web pages (the market terminal's: GUI.dll's BrowserWindow_c, Awesomium there): WebView2 through wry, its
# site's requests passed on with the game's headers by a plain HTTP client.
[target.'cfg(windows)'.dependencies]
ureq = { version = "=2.12.1", default-features = false }
# (what a site sends compressed is opened before its addresses are rewritten)
flate2 = "1.1.10"
wry = { version = "=0.53.5", default-features = false, features = ["protocol"] }
# The screenshot key's picture: the game window as it shows on the screen, its open windows and web page too.
xcap = { version = "=0.7.1", default-features = false }

[lints]
workspace = true
