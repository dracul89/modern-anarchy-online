[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
# (deny, not forbid: one call of the system's is allowed where nothing safe gives what the original reads, marked
# `#[allow(unsafe_code)]` and kept to a few lines: the monitor's work area, mao-client viewer.rs `work_area`)
unsafe_code = "deny"

[workspace.dependencies]
mao-formats = { path = "crates/mao-formats" }
mao-net = { path = "crates/mao-net" }
mao-render = { path = "crates/mao-render" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
