[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
mao-formats = { path = "crates/mao-formats" }
mao-net = { path = "crates/mao-net" }
mao-render = { path = "crates/mao-render" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
